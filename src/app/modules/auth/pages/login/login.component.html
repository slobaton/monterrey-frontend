<p-toast
  key="login"
  [preventOpenDuplicates]="true"
  position="top-right"
></p-toast>
<div
  class="surface-ground flex align-items-center justify-content-center min-h-screen min-w-screen overflow-hidden"
>
  <div class="flex flex-column align-items-center justify-content-center">
    <img
      src="assets/layout/images/logo.png"
      alt="Monterrey Logo"
      class="mb-5 w-19rem flex-shrink-0"
    />
    <div
      style="
        border-radius: 56px;
        padding: 0.3rem;
        background: linear-gradient(
          180deg,
          var(--primary-color) 10%,
          rgba(33, 150, 243, 0) 30%
        );
      "
    >
      <div
        class="w-full surface-card py-8 px-5 sm:px-8"
        style="border-radius: 53px"
      >
        <div class="text-center mb-5">
          <div class="text-900 text-3xl font-medium mb-3">Bienvenido!</div>
          <span class="text-600 font-medium">
            Inicia sesión para continuar...
          </span>
        </div>

        <form [formGroup]="loginForm" (ngSubmit)="onSubmit()">
          <div>
            <label
              for="username"
              class="block text-900 text-xl font-medium mb-2"
            >
              Nombre de Usuario
            </label>
            <input
              id="username"
              formControlName="username"
              type="text"
              placeholder="Nombre de usuario"
              pInputText
              class="w-full md:w-30rem mb-5"
              style="padding: 1rem"
            />

            <label
              for="password"
              class="block text-900 font-medium text-xl mb-2"
            >
              Password
            </label>
            <p-password
              id="password"
              formControlName="password"
              placeholder="Password"
              [toggleMask]="true"
              [feedback]="false"
              styleClass="mb-5"
              inputStyleClass="w-full p-3 md:w-30rem"
            ></p-password>

            <div
              class="flex align-items-center justify-content-center mb-5 gap-5"
            >
              <button
                type="submit"
                pButton
                pRipple
                label="Iniciar Sesión"
                class="w-full p-3 text-xl"
                [disabled]="loginForm.invalid || isProcessing"
                icon="pi pi-unlock"
                [loading]="isProcessing"
              ></button>
            </div>
          </div>
        </form>
      </div>
    </div>
  </div>
</div>
