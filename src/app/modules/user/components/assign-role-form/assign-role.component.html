<app-form
  [form]="roleUserForm"
  [onProcessCompleted]="formProcessEvent"
  (onSubmit)="onSubmitForm($event)"
>
  <div [formGroup]="roleUserForm">
    <div formArrayName="roleIds">
      <div *ngFor="let control of rolesFormControl; let i = index">
        <p-checkbox
          [formControl]="control"
          [label]="roles[i].name || ''"
          [value]="roles[i]"
          [binary]="true">
        </p-checkbox>
      </div>
    </div>
  </div>
</app-form>
