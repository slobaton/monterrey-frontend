<div class="grid">
  <div class="col-12">
    <app-page-card title="Usuarios">
      <app-confirm-dialog
        id="confirmDelete"
        title="Eliminar Usuario"
        message="¿Estas seguro que deseas eliminar al usuario?"
      ></app-confirm-dialog>
      <app-data-table
        #userTable
        [tableConfig]="tableConfig"
        [sourceDataService]="userService"
      ></app-data-table>
    </app-page-card>
  </div>
</div>
