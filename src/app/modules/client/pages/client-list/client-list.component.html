<div *ngIf="ability$ | async as ab" class="grid">
  <div class="col-12">
    <app-page-card *ngIf="ab.can('read', 'client')" title="Clientes">
      <app-confirm-dialog
        id="confirmDelete"
        title="Eliminar Cliente"
        message="¿Estas seguro de eliminar el cliente?"
      ></app-confirm-dialog>
      <app-data-table
        #clientTable
        [tableConfig]="tableConfig"
        [sourceDataService]="clientService"
      ></app-data-table>
    </app-page-card>
  </div>
</div>
