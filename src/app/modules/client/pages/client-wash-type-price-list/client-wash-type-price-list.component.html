<div class="grid">
  <div class="col-12">
    <div class="card mb-0">
      <h5>Precios de Lavado</h5>
      <app-confirm-dialog
        id="confirmWashTypePriceDelete"
        title="Eliminar Precio Lavado"
        message="¿Estas seguro de eliminar el precio para cliente?"
      ></app-confirm-dialog>
      <app-data-table
        #washPricesTable
        [searchEnabled]="false"
        [tableConfig]="tableConfig"
        [sourceDataService]="washTypePriceService"
        [extraParams]="clientId"
      ></app-data-table>
    </div>
  </div>
</div>
