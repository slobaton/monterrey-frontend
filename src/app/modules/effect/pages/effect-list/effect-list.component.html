<div *ngIf="ability$ | async as ab" class="grid">
  <div *ngIf="ab.can('read', 'effect')" class="col-12">
    <app-page-card title="Efectos">
      <app-confirm-dialog
        id="confirmDelete"
        title="Eliminar Efecto"
        message="¿Estas seguro de eliminar el efecto?"
      ></app-confirm-dialog>
      <app-data-table
        #effectTable
        [tableConfig]="tableConfig"
        [sourceDataService]="effectService"
        [rowDetails]="rowDetails"
      ></app-data-table>
      <ng-template #rowDetails let-rowData>
        <div class="grid mt-1">
          <div class="col-12">
            <h6>Descripción:</h6>
            <p>{{ rowData["description"] }}</p>
          </div>
        </div>
      </ng-template>
    </app-page-card>
  </div>
</div>
