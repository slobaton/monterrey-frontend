<app-form
  [form]="washOrderDetailForm"
  [onProcessCompleted]="formProcessEvent"
  (onSubmit)="onSubmitForm($event)"
  submitLabel="Agregar Detalle"
>
  <div class="form-container p-fluid p-formgrid grid">
    <div class="col-3">
      <app-form-label
        id="cloth_type_id"
        text="Tipo de Ropa"
        [required]="true"
      />
      <app-form-select
        [form]="washOrderDetailForm"
        id="cloth_type_id"
        controlName="cloth_type_id"
        placeholder="Seleccione un tipo de ropa..."
        optionLabel="name"
        optionValue="id"
        [filterEnabled]="true"
        [isLazy]="true"
        [sourceDataService]="clothTypeService"
      >
      </app-form-select>
    </div>
    <div class="col-3">
      <app-form-label
        id="cloth_size_id"
        text="Tamaño de Ropa"
        [required]="true"
      />
      <app-form-select
        [form]="washOrderDetailForm"
        id="cloth_size_id"
        controlName="cloth_size_id"
        placeholder="Seleccione un tamaño de ropa..."
        optionLabel="name"
        optionValue="id"
        [filterEnabled]="true"
        [isLazy]="true"
        [sourceDataService]="clothSizeService"
      >
      </app-form-select>
    </div>
    <div class="col-3">
      <app-form-label
        id="buttonholes_price"
        text="Precio Ojal"
        [required]="true"
      />
      <app-form-input-number
        [form]="washOrderDetailForm"
        id="buttonholes_price"
        controlName="buttonholes_price"
        placeholder="Precio Ojal..."
        mode="decimal"
      />
    </div>
    <div class="col-3">
      <app-form-label
        id="num_buttonholes"
        text="Num. Ojales"
        [required]="true"
      />
      <app-form-input-number
        [form]="washOrderDetailForm"
        id="num_buttonholes"
        controlName="num_buttonholes"
        placeholder="Num. Ojales..."
      />
    </div>

    <div class="col-6">
      <app-form-label id="quantity" text="Cantidad" [required]="true" />
      <app-form-input-number
        [form]="washOrderDetailForm"
        id="quantity"
        controlName="quantity"
        placeholder="Cantidad..."
      />
    </div>
    <div class="col-3 text-center">
      <h6>Focalizado</h6>
      <app-form-switch
        [form]="washOrderDetailForm"
        id="is_focalizado_active"
        controlName="is_focalizado_active"
      ></app-form-switch>
    </div>
    <div class="col-3 text-center">
      <h6>Nevado</h6>
      <app-form-switch
        [form]="washOrderDetailForm"
        id="is_nevado_active"
        controlName="is_nevado_active"
      ></app-form-switch>
    </div>

    <div class="col-12 py-0 my-0">
      <app-form-label id="observations" text="Descripción" />
      <app-form-textarea
        [form]="washOrderDetailForm"
        id="observations"
        controlName="observations"
        placeholder="Ingrese las observaciones del detalle..."
      ></app-form-textarea>
    </div>

    <div class="col-12 py-0 my-0">
      <app-list-picker
        [sourceDataService]="effectService"
        [isLazy]="true"
        filterBy="name"
        [filterEnabled]="true"
        filterPlaceholder="Buscar Efecto..."
        sourceHeader="Efectos Disponibles"
        targetHeader="Efectos Seleccionados"
        (onChangeSelection)="onEffectSelection($event)"
        [item]="itemTemplate"
      ></app-list-picker>
      <ng-template #itemTemplate let-item>
        {{ item.name }} - {{ item.price }} .Bs
      </ng-template>
    </div>
  </div>
</app-form>
