<div class="grid">
  <div class="col-12">
    <div class="card mb-0">
      <h5>Tipos de Lavado</h5>

        id="confirmDelete"
        title="Eliminar Tipo de Lavado"
        message="¿Estas seguro de eliminar el tipo de lavado?"
      ></app-confirm-dialog>
      <app-data-table
        #washTypeTable

      ></app-data-table>
    </div>
  </div>
</div>
