<p-toast
  [key]="id"
  position="top-right"
  [preventOpenDuplicates]="true"
></p-toast>

<p-confirmDialog
  [key]="id"
  [header]="title ?? '¿Estás seguro?'"
  [message]="message ?? '¿Realmente deseas continuar?'"
  [icon]="icon"
  acceptLabel="Aceptar"
  acceptButtonStyleClass="p-button-success"
  rejectLabel="Cancelar"
  rejectButtonStyleClass="p-button-danger"
></p-confirmDialog>
