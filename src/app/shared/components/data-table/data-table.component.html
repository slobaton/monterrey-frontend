<p-table
  [columns]="tableDefinition.columns"
  [value]="data"
  styleClass="p-datatable-sm"
  [tableStyle]="{ 'min-width': '50rem' }"
  [lazy]="true"
  (onLazyLoad)="loadData($event)"
  dataKey="id"
  [paginator]="true"
  [rows]="10"
  [totalRecords]="totalRecords"
  [loading]="isLoading"
  currentPageReportTemplate="Mostrando {first} a {last} de {totalRecords} registros"
  [showCurrentPageReport]="true"
>
  <ng-template pTemplate="header" let-columns>
    <tr>
      <ng-container *ngFor="let col of columns">
        <th
          *ngIf="col.sortable; else nonSortableColumn"
          [pSortableColumn]="col.propertyRef"
          style="width: 20%"
        >
          {{ col.title }} <p-sortIcon field="col.propertyRef"></p-sortIcon>
        </th>
        <ng-template #nonSortableColumn>
          <th>
            {{ col.title }}
          </th>
        </ng-template>
      </ng-container>

      <th *ngIf="hasActions()">Acciones</th>
    </tr>
  </ng-template>
  <ng-template pTemplate="body" let-rowData let-columns="columns">
    <tr>
      <td *ngFor="let col of columns">
        {{ rowData[col.propertyRef] }}
      </td>

      <td *ngIf="hasActions()">
        <button
          *ngFor="let action of tableDefinition.actions"
          pButton
          pRipple
          [icon]="generateActionIcon(action)"
          [ngClass]="generateActionColor(action)"
          (click)="action.callback(rowData.id)"
        ></button>
      </td>
    </tr>
  </ng-template>
</p-table>
